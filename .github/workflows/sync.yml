name: Nightly data sync

# ---------------------------------------------------------------------------
# Pulls Klaviyo, LoyaltyLion and Shopify into Supabase.
#
# IMPORTANT: this nightly write is also what stops the free-tier Supabase
# project from pausing after a week of inactivity. It must stay here and must
# NOT be moved into Supabase's own scheduler — a paused project cannot run its
# own cron, so scheduling it there would be self-defeating.
# ---------------------------------------------------------------------------

on:
  schedule:
    # 23:00 UTC = 02:00 Asia/Amman. Jordan dropped DST in 2022 and sits at
    # UTC+3 all year, so this single expression is correct year-round.
    - cron: "0 23 * * *"
    # Weekly database dump, Sundays 01:00 UTC = 04:00 Amman, well clear of the
    # nightly sync. The Supabase free tier includes NO backups of any kind —
    # not short retention, none — and point-in-time recovery is Pro-only. The
    # backfilled history costs ~20 hours of rate-limited Klaviyo calls to
    # rebuild, so this is the only thing standing between us and that.
    - cron: "0 1 * * 0"

  workflow_dispatch:
    inputs:
      from:
        description: "Start date YYYY-MM-DD (blank = trailing 3 days)"
        required: false
        type: string
      to:
        description: "End date YYYY-MM-DD (blank = today, Amman time)"
        required: false
        type: string
      sources:
        description: "Which sources to run"
        required: false
        default: "klaviyo,shopify,loyaltylion"
        type: choice
        options:
          - "klaviyo,shopify,loyaltylion"
          - "klaviyo,shopify"
          - "klaviyo"
          - "shopify"
          - "loyaltylion"
      dry_run:
        description: "Fetch and report only — write nothing"
        required: false
        default: false
        type: boolean
      force:
        description: "Re-sync days already recorded as successful"
        required: false
        default: false
        type: boolean
      backup:
        description: "Also take a database dump on this run"
        required: false
        default: false
        type: boolean

# One run at a time. Two syncs overlapping would fight over the same rows and
# the resume ledger, and a manual backfill could collide with the nightly job.
concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Sized against a real run: the first backfill night took 1h42m with
    # REACH_MAX_DAYS at 40, which left only 18 minutes under the old 120-minute
    # cap. Raising the reach rate would have been silently killed mid-run.
    # 330 leaves room to raise it while staying under GitHub's 360-minute
    # ceiling for a job.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # No cache and no install step: the sync script has zero
          # dependencies by design and needs only a Node with fetch.

      - name: Show what this run will do
        run: |
          echo "from    : ${FROM:-trailing 3 days}"
          echo "to      : ${TO:-today (Amman)}"
          echo "sources : $SOURCES"
          echo "dry run : $DRY_RUN"
          echo "force   : $FORCE"
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          SOURCES: ${{ inputs.sources || 'klaviyo,shopify,loyaltylion' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORCE: ${{ inputs.force || false }}

      - name: Run sync
        id: sync
        env:
          # Secrets are passed as environment variables and never interpolated
          # into a command line, so they cannot leak via the run log's echoed
          # command or via `ps`.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          LOYALTYLION_API_KEY: ${{ secrets.LOYALTYLION_API_KEY }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN || 'drynksapp.myshopify.com' }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          SOURCES: ${{ inputs.sources || 'klaviyo,shopify,loyaltylion' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -o pipefail
          args=(--only "$SOURCES")
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ -n "$TO" ]   && args+=(--to "$TO")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE" = "true" ]   && args+=(--force)
          node scripts/sync.mjs "${args[@]}" 2>&1 | tee sync-output.txt

      # ---------------------------------------------------------------------
      # Backfill continuation.
      #
      # Klaviyo allows 225 values-report calls a day, so a 600-day backfill
      # cannot finish in one run. Rather than relying on someone remembering to
      # re-trigger it each day — which is exactly the thing that gets forgotten
      # and leaves a third of a backfill — the nightly job chips away at it
      # automatically until it is done.
      #
      # Set the repository variable BACKFILL_FROM (Settings > Secrets and
      # variables > Actions > Variables) to e.g. 2025-01-01 to arm it. The step
      # skips itself when the variable is unset, and the sync skips days already
      # recorded as successful, so it stops doing work once the range is full.
      # Clear the variable when the backfill is done.
      # ---------------------------------------------------------------------
      - name: Continue backfill
        if: ${{ vars.BACKFILL_FROM != '' && inputs.dry_run != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          BACKFILL_FROM: ${{ vars.BACKFILL_FROM }}
          # 190 leaves headroom under Klaviyo's 225/day cap for the nightly
          # trailing-3-day run and the campaign report that precede this.
          MAX_DAYS: ${{ vars.BACKFILL_MAX_DAYS || '190' }}
        run: |
          set -o pipefail
          echo "Continuing backfill from $BACKFILL_FROM, up to $MAX_DAYS flow days this run."
          node scripts/sync.mjs \
            --only klaviyo \
            --from "$BACKFILL_FROM" \
            --max-days "$MAX_DAYS" 2>&1 | tee -a sync-output.txt

      # ---------------------------------------------------------------------
      # Unique reach.
      #
      # Walks every send event for a day to collect distinct profiles, roughly
      # two minutes a day. Stored as daily SETS so any range is a union in
      # Postgres rather than a fresh crawl — that is what keeps a report export
      # for an arbitrary month instant instead of a twenty-minute wait.
      #
      # Same BACKFILL_FROM variable as the flows: while it is set, this chips
      # away at history a bounded number of days per night.
      # ---------------------------------------------------------------------
      - name: Unique reach
        if: ${{ inputs.dry_run != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          BACKFILL_FROM: ${{ vars.BACKFILL_FROM }}
          REACH_MAX_DAYS: ${{ vars.REACH_MAX_DAYS || '40' }}
        run: |
          set -o pipefail
          # Yesterday always, plus backfill days while BACKFILL_FROM is set.
          FROM="${BACKFILL_FROM:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          echo "Reach from $FROM, up to $REACH_MAX_DAYS day(s) this run."
          node scripts/sync.mjs --only reach --from "$FROM" \
            --max-days "$REACH_MAX_DAYS" 2>&1 | tee -a sync-output.txt

      # ---------------------------------------------------------------------
      # Weekly database dump.
      #
      # Stored as a workflow ARTIFACT, deliberately not committed to the repo:
      #   * the dump contains every table including the hashed profile-ID sets,
      #     and a repo is the wrong place for that even gitignored — one
      #     `git add -A` publishes it permanently and irreversibly;
      #   * ~60 MB weekly would bloat git history forever, and pruning it later
      #     means rewriting published history;
      #   * artifacts have built-in retention and are limited to people with
      #     repo access, which a committed file is not.
      #
      # Encrypted at rest with BACKUP_PASSPHRASE on top of that access control.
      # NOTE: lose that passphrase and the dumps are unrecoverable — store it
      # in the same password manager as the dashboard login.
      # ---------------------------------------------------------------------
      - name: Database dump
        if: ${{ github.event.schedule == '0 1 * * 0' || inputs.backup == true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Supabase Dashboard > Project Settings > Database > Connection string (URI)."
            exit 1
          fi
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_PASSPHRASE is not set. Refusing to upload an unencrypted dump."
            exit 1
          fi

          # Match the server major version; a mismatched pg_dump refuses to run.
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

          STAMP="$(date -u +%Y-%m-%d)"
          # Only the public schema: Supabase's internal schemas are managed and
          # are not ours to restore.
          pg_dump --schema=public --no-owner --no-privileges --format=custom \
                  --file="fyxx-${STAMP}.dump" "$SUPABASE_DB_URL"

          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "fyxx-${STAMP}.dump" -out "fyxx-${STAMP}.dump.enc" \
            -pass env:BACKUP_PASSPHRASE
          rm -f "fyxx-${STAMP}.dump"

          SIZE=$(du -h "fyxx-${STAMP}.dump.enc" | cut -f1)
          echo "BACKUP_FILE=fyxx-${STAMP}.dump.enc" >> "$GITHUB_ENV"
          echo "BACKUP_SIZE=${SIZE}" >> "$GITHUB_ENV"
          echo "Dump written: fyxx-${STAMP}.dump.enc (${SIZE}, encrypted)"

      - name: Upload dump
        if: ${{ (github.event.schedule == '0 1 * * 0' || inputs.backup == true) && env.BACKUP_FILE != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: db-backup-${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          # ~13 weekly dumps retained, so one bad dump never leaves us with
          # nothing to fall back to.
          retention-days: 90
          if-no-files-found: error

      # A successful dump is otherwise invisible to the dashboard — artifacts
      # live in GitHub, not the database. Recording it in sync_log is what lets
      # the health view answer "when was the last good backup" without anyone
      # opening the Actions tab.
      - name: Record backup in sync_log
        if: ${{ (github.event.schedule == '0 1 * * 0' || inputs.backup == true) && env.BACKUP_FILE != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl -sS -o /dev/null -w "sync_log <- HTTP %{http_code}\n" \
            -X POST "$SUPABASE_URL/rest/v1/sync_log" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"source\":\"database_backup\",\"status\":\"success\",\"rows_written\":1,\"message\":\"${BACKUP_FILE} (${BACKUP_SIZE}, encrypted artifact, 90-day retention)\"}"

      - name: Write run summary
        # Runs even on failure, so a bad night is readable without opening logs.
        if: always()
        run: |
          {
            echo "### Data sync — ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Range | ${FROM:-trailing 3 days} → ${TO:-today} |"
            echo "| Sources | \`$SOURCES\` |"
            echo "| Dry run | $DRY_RUN |"
            echo ""
            echo "<details><summary>Output</summary>"
            echo ""
            echo '```'
            # The script redacts secrets on every line, but truncate anyway so
            # a runaway log cannot blow the 1 MB summary limit.
            tail -c 60000 sync-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          SOURCES: ${{ inputs.sources || 'klaviyo,shopify,loyaltylion' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
