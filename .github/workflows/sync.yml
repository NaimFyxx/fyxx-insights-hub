name: Nightly data sync

# ---------------------------------------------------------------------------
# Pulls Klaviyo, LoyaltyLion and Shopify into Supabase.
#
# IMPORTANT: this nightly write is also what stops the free-tier Supabase
# project from pausing after a week of inactivity. It must stay here and must
# NOT be moved into Supabase's own scheduler — a paused project cannot run its
# own cron, so scheduling it there would be self-defeating.
# ---------------------------------------------------------------------------

on:
  schedule:
    # 23:00 UTC = 02:00 Asia/Amman. Jordan dropped DST in 2022 and sits at
    # UTC+3 all year, so this single expression is correct year-round.
    - cron: "0 23 * * *"

  workflow_dispatch:
    inputs:
      from:
        description: "Start date YYYY-MM-DD (blank = trailing 3 days)"
        required: false
        type: string
      to:
        description: "End date YYYY-MM-DD (blank = today, Amman time)"
        required: false
        type: string
      sources:
        description: "Which sources to run"
        required: false
        default: "klaviyo,shopify,loyaltylion"
        type: choice
        options:
          - "klaviyo,shopify,loyaltylion"
          - "klaviyo,shopify"
          - "klaviyo"
          - "shopify"
          - "loyaltylion"
      dry_run:
        description: "Fetch and report only — write nothing"
        required: false
        default: false
        type: boolean
      force:
        description: "Re-sync days already recorded as successful"
        required: false
        default: false
        type: boolean

# One run at a time. Two syncs overlapping would fight over the same rows and
# the resume ledger, and a manual backfill could collide with the nightly job.
concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Sized against a real run: the first backfill night took 1h42m with
    # REACH_MAX_DAYS at 40, which left only 18 minutes under the old 120-minute
    # cap. Raising the reach rate would have been silently killed mid-run.
    # 330 leaves room to raise it while staying under GitHub's 360-minute
    # ceiling for a job.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # No cache and no install step: the sync script has zero
          # dependencies by design and needs only a Node with fetch.

      - name: Show what this run will do
        run: |
          echo "from    : ${FROM:-trailing 3 days}"
          echo "to      : ${TO:-today (Amman)}"
          echo "sources : $SOURCES"
          echo "dry run : $DRY_RUN"
          echo "force   : $FORCE"
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          SOURCES: ${{ inputs.sources || 'klaviyo,shopify,loyaltylion' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORCE: ${{ inputs.force || false }}

      # continue-on-error, NOT because a failure is acceptable, but so the
      # steps below still run. The job is still failed — the gate at the bottom
      # does that once every step has had its turn. Before this, a LoyaltyLion
      # false alarm on 31 August aborted the Shopify repair, which had nothing
      # to do with it, and cost a loyalty snapshot that cannot be recovered.
      - name: Run sync
        id: sync
        continue-on-error: true
        env:
          # Secrets are passed as environment variables and never interpolated
          # into a command line, so they cannot leak via the run log's echoed
          # command or via `ps`.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          LOYALTYLION_API_KEY: ${{ secrets.LOYALTYLION_API_KEY }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN || 'drynksapp.myshopify.com' }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          SOURCES: ${{ inputs.sources || 'klaviyo,shopify,loyaltylion' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -o pipefail
          args=(--only "$SOURCES")
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ -n "$TO" ]   && args+=(--to "$TO")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE" = "true" ]   && args+=(--force)
          node scripts/sync.mjs "${args[@]}" 2>&1 | tee sync-output.txt

      # ---------------------------------------------------------------------
      # Retroactive-change repair.
      #
      # The sync above searches Shopify by CREATED date, so it structurally
      # cannot see a change to an older order. An order placed on the 21st and
      # cancelled on the 30th is never re-read and its revenue stays on the
      # books forever — not seen late, never seen.
      #
      # Measured against a real cancellation batch on 30 August 2026: ten
      # orders cancelled worth 1,400.750 JOD plus two silent revenue edits,
      # a net -1,339.400 JOD (-1.55%) over a trailing fortnight. The oldest was
      # nine days old and the largest single one.
      #
      # This re-reads by UPDATED date instead, which catches all of it. Thirty
      # days of updates is ~3,700 orders and 15 seconds, against 163,000 and
      # fourteen minutes for a full sweep, so it runs every night rather than
      # waiting for someone to notice a number drifting.
      # ---------------------------------------------------------------------
      - name: Repair retroactive changes (cancellations, refunds, edits)
        id: repair
        continue-on-error: true
        # !cancelled() rather than always(): a cancelled run should stop, but a
        # failed sync must not prevent an unrelated repair.
        if: ${{ !cancelled() && inputs.dry_run != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN || 'drynksapp.myshopify.com' }}
        run: node scripts/sync-orders.mjs --repair 30 --write

      # ---------------------------------------------------------------------
      # Backfill continuation.
      #
      # Klaviyo allows 225 values-report calls a day, so a 600-day backfill
      # cannot finish in one run. Rather than relying on someone remembering to
      # re-trigger it each day — which is exactly the thing that gets forgotten
      # and leaves a third of a backfill — the nightly job chips away at it
      # automatically until it is done.
      #
      # Set the repository variable BACKFILL_FROM (Settings > Secrets and
      # variables > Actions > Variables) to e.g. 2025-01-01 to arm it. The step
      # skips itself when the variable is unset, and the sync skips days already
      # recorded as successful, so it stops doing work once the range is full.
      # Clear the variable when the backfill is done.
      # ---------------------------------------------------------------------
      - name: Continue backfill
        id: backfill
        continue-on-error: true
        if: ${{ !cancelled() && vars.BACKFILL_FROM != '' && inputs.dry_run != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          BACKFILL_FROM: ${{ vars.BACKFILL_FROM }}
          # 190 leaves headroom under Klaviyo's 225/day cap for the nightly
          # trailing-3-day run and the campaign report that precede this.
          MAX_DAYS: ${{ vars.BACKFILL_MAX_DAYS || '190' }}
        run: |
          set -o pipefail
          echo "Continuing backfill from $BACKFILL_FROM, up to $MAX_DAYS flow days this run."
          node scripts/sync.mjs \
            --only klaviyo \
            --from "$BACKFILL_FROM" \
            --max-days "$MAX_DAYS" 2>&1 | tee -a sync-output.txt

      # ---------------------------------------------------------------------
      # Unique reach.
      #
      # Walks every send event for a day to collect distinct profiles, roughly
      # two minutes a day. Stored as daily SETS so any range is a union in
      # Postgres rather than a fresh crawl — that is what keeps a report export
      # for an arbitrary month instant instead of a twenty-minute wait.
      #
      # Same BACKFILL_FROM variable as the flows: while it is set, this chips
      # away at history a bounded number of days per night.
      # ---------------------------------------------------------------------
      - name: Unique reach
        id: reach
        continue-on-error: true
        if: ${{ !cancelled() && inputs.dry_run != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          BACKFILL_FROM: ${{ vars.BACKFILL_FROM }}
          REACH_MAX_DAYS: ${{ vars.REACH_MAX_DAYS || '40' }}
        run: |
          set -o pipefail
          # Yesterday always, plus backfill days while BACKFILL_FROM is set.
          FROM="${BACKFILL_FROM:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          echo "Reach from $FROM, up to $REACH_MAX_DAYS day(s) this run."
          node scripts/sync.mjs --only reach --from "$FROM" \
            --max-days "$REACH_MAX_DAYS" 2>&1 | tee -a sync-output.txt

      - name: Write run summary
        # Runs even on failure, so a bad night is readable without opening logs.
        if: always()
        run: |
          {
            echo "### Data sync — ${{ job.status }}"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| Sync | ${{ steps.sync.outcome }} |"
            echo "| Retroactive repair | ${{ steps.repair.outcome || 'skipped' }} |"
            echo "| Backfill | ${{ steps.backfill.outcome || 'skipped' }} |"
            echo "| Unique reach | ${{ steps.reach.outcome || 'skipped' }} |"
            echo ""
            echo "Each step runs independently: one failing no longer prevents the others."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Range | ${FROM:-trailing 3 days} → ${TO:-today} |"
            echo "| Sources | \`$SOURCES\` |"
            echo "| Dry run | $DRY_RUN |"
            echo ""
            echo "<details><summary>Output</summary>"
            echo ""
            echo '```'
            # The script redacts secrets on every line, but truncate anyway so
            # a runaway log cannot blow the 1 MB summary limit.
            tail -c 60000 sync-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          SOURCES: ${{ inputs.sources || 'klaviyo,shopify,loyaltylion' }}
          DRY_RUN: ${{ inputs.dry_run || false }}

      # ---------------------------------------------------------------------
      # The gate.
      #
      # Every step above is continue-on-error so that one failure cannot cancel
      # the rest. On its own that would silently turn a failed night GREEN,
      # which is worse than the problem it fixes — so the job's real verdict is
      # decided here, after every step has had its turn, and names which failed.
      # ---------------------------------------------------------------------
      - name: Fail the run if any step failed
        if: always()
        env:
          SYNC: ${{ steps.sync.outcome }}
          REPAIR: ${{ steps.repair.outcome }}
          BACKFILL: ${{ steps.backfill.outcome }}
          REACH: ${{ steps.reach.outcome }}
        run: |
          # The sync step carries no `if:`, so it ALWAYS produces an outcome.
          # An empty one means the step id no longer resolves — a rename, or a
          # step deleted — and the gate would then wave every failure through
          # while looking healthy. Fail loudly instead of silently passing.
          if [ -z "$SYNC" ]; then
            echo "Gate cannot read steps.sync.outcome — the step id has changed."
            echo "Fix the gate before trusting this workflow: it would pass regardless."
            exit 1
          fi
          failed=""
          [ "$SYNC" = "failure" ]     && failed="$failed sync"
          [ "$REPAIR" = "failure" ]   && failed="$failed retroactive-repair"
          [ "$BACKFILL" = "failure" ] && failed="$failed backfill"
          [ "$REACH" = "failure" ]    && failed="$failed unique-reach"
          if [ -n "$failed" ]; then
            echo "Failed step(s):$failed"
            echo "Every other step still ran and wrote what it could."
            exit 1
          fi
          echo "All steps completed."
